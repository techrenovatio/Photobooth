<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pahri Bros.</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background-color: #030712;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        #game-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            aspect-ratio: 16/9;
            background: linear-gradient(to bottom, #070e26, #0a1b42);
            border: 3px solid #38bdf8;
            box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
            border-radius: 12px;
            overflow: hidden;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .overlay-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(7, 14, 38, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
            padding: 10px;
        }

        .hidden { display: none !important; }

        .pixel-title {
            font-size: clamp(22px, 5vw, 38px);
            font-weight: 900;
            color: #ec4899;
            text-shadow: 3px 3px 0px #38bdf8;
            margin-bottom: 20px;
            text-align: center;
        }

        .btn-pixel {
            background: linear-gradient(135deg, #0ea5e9, #2563eb);
            color: white;
            border: 2px solid #38bdf8;
            padding: 10px 25px;
            font-family: inherit;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin: 5px;
            width: 180px;
            text-align: center;
        }

        /* VIRTUAL TOUCH CONTROLS UNTUK HP / TABLET */
        #touch-controls {
            position: absolute;
            bottom: 10px;
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            padding: 0 15px;
            z-index: 5;
            pointer-events: none;
        }

        .touch-group {
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }

        .touch-btn {
            width: 50px;
            height: 50px;
            background: rgba(56, 189, 248, 0.3);
            border: 2px solid #38bdf8;
            border-radius: 50%;
            color: white;
            font-size: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(4px);
            touch-action: manipulation;
        }

        .touch-btn:active {
            background: rgba(56, 189, 248, 0.7);
            transform: scale(0.95);
        }

        .save-list { width: 90%; max-height: 180px; overflow-y: auto; margin-bottom: 10px; }
        .save-item { background: rgba(15, 23, 42, 0.8); border: 1px solid #38bdf8; border-radius: 6px; padding: 8px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .save-info { font-size: 12px; color: #38bdf8; }
        .save-actions button { padding: 4px 8px; font-size: 10px; border-radius: 4px; border: none; font-weight: bold; }
        .btn-play { background: #22c55e; color: white; }
        .btn-del { background: #ef4444; color: white; }
        input[type="text"] { padding: 8px; border-radius: 6px; border: 2px solid #38bdf8; background: #0f172a; color: white; font-size: 12px; margin-bottom: 10px; width: 180px; text-align: center; }
    </style>
</head>
<body>

    <div id="game-container">
        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <!-- TOUCH CONTROLS FOR MOBILE -->
        <div id="touch-controls">
            <div class="touch-group">
                <button class="touch-btn" id="btnLeft">◀</button>
                <button class="touch-btn" id="btnRight">▶</button>
            </div>
            <div class="touch-group">
                <button class="touch-btn" id="btnJump" style="background: rgba(236, 72, 153, 0.4); border-color:#ec4899;">▲</button>
            </div>
        </div>

        <!-- OVERLAY SCREENS -->
        <div id="mainMenu" class="overlay-screen">
            <h1 class="pixel-title">PAHRI BROS.</h1>
            <button class="btn-pixel" onclick="showNewGameScreen()">NEW GAME</button>
            <button class="btn-pixel" onclick="showLoadGameScreen()">LOAD GAME</button>
        </div>

        <div id="newGameScreen" class="overlay-screen hidden">
            <h2 class="pixel-title" style="font-size:18px;">MASUKKAN NAMA</h2>
            <input type="text" id="playerNameInput" placeholder="Nama Pemain..." maxlength="10">
            <button class="btn-pixel" onclick="startNewGame()">MULAI MAIN</button>
            <button class="btn-pixel" style="background:#64748b;" onclick="showMainMenu()">KEMBALI</button>
        </div>

        <div id="loadGameScreen" class="overlay-screen hidden">
            <h2 class="pixel-title" style="font-size:18px; margin-bottom:10px;">PILIH SAVE GAME</h2>
            <div id="saveList" class="save-list"></div>
            <button class="btn-pixel" style="background:#64748b;" onclick="showMainMenu()">KEMBALI</button>
        </div>

        <div id="levelTransitionScreen" class="overlay-screen hidden">
            <h1 id="transLevelTitle" class="pixel-title" style="color:#38bdf8;">LEVEL 1</h1>
            <p id="transLivesText" style="font-size:16px; color:#38bdf8; font-weight:bold;">NYAWA x 10</p>
        </div>
    </div>

    <script>
        // AUDIO & GAME ENGINE
        let audioCtx = null;
        function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain); gain.connect(audioCtx.destination);
            const now = audioCtx.currentTime;
            if (type === 'jump') {
                osc.type = 'square'; osc.frequency.setValueAtTime(150, now); osc.frequency.exponentialRampToValueAtTime(400, now + 0.15);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                osc.start(now); osc.stop(now + 0.15);
            } else if (type === 'coin') {
                osc.type = 'sine'; osc.frequency.setValueAtTime(987.77, now); osc.frequency.setValueAtTime(1318.51, now + 0.08);
                gain.gain.setValueAtTime(0.1, now); gain.gain.linearRampToValueAtTime(0.01, now + 0.2);
                osc.start(now); osc.stop(now + 0.2);
            }
        }

        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");

        let gameState = "MENU";
        let currentPlayer = "Bagol";
        let currentLevelNum = 1;
        let score = 400;
        let fishCount = 0;
        let bankScore = 4;
        let lives = 10;
        let timeLeft = 600;
        let timerInterval = null;
        let cameraX = 0;

        const keys = { right: false, left: false, up: false };

        // TOUCH CONTROLS BINDING
        const btnLeft = document.getElementById("btnLeft");
        const btnRight = document.getElementById("btnRight");
        const btnJump = document.getElementById("btnJump");

        const bindTouch = (elem, keyName) => {
            elem.addEventListener("touchstart", (e) => { e.preventDefault(); initAudio(); keys[keyName] = true; if(keyName === 'up' && gameState === 'PLAYING' && player.grounded) { player.vy = -player.jumpStrength; player.grounded = false; playSound('jump'); } });
            elem.addEventListener("touchend", (e) => { e.preventDefault(); keys[keyName] = false; });
            elem.addEventListener("mousedown", () => { initAudio(); keys[keyName] = true; if(keyName === 'up' && gameState === 'PLAYING' && player.grounded) { player.vy = -player.jumpStrength; player.grounded = false; playSound('jump'); } });
            elem.addEventListener("mouseup", () => keys[keyName] = false);
        };

        bindTouch(btnLeft, "left");
        bindTouch(btnRight, "right");
        bindTouch(btnJump, "up");

        window.addEventListener("keydown", (e) => {
            initAudio();
            if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = true;
            if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = true;
            if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") {
                keys.up = true;
                if (gameState === "PLAYING" && player.grounded) {
                    player.vy = -player.jumpStrength; player.grounded = false; playSound('jump');
                }
            }
        });
        window.addEventListener("keyup", (e) => {
            if (e.code === "ArrowRight" || e.code === "KeyD") keys.right = false;
            if (e.code === "ArrowLeft" || e.code === "KeyA") keys.left = false;
            if (e.code === "ArrowUp" || e.code === "KeyW" || e.code === "Space") keys.up = false;
        });

        const player = { x: 50, y: 300, width: 24, height: 32, vx: 0, vy: 0, speed: 3.8, jumpStrength: 10.5, gravity: 0.5, grounded: false };
        let platforms = [], fishes = [], enemies = [], spikes = [], flag = null;

        function loadLevel(levelNum) {
            currentLevelNum = levelNum; player.x = 50; player.y = 200; player.vx = 0; player.vy = 0; cameraX = 0;
            platforms = []; fishes = []; enemies = []; spikes = [];
            if (levelNum === 1) {
                platforms.push({ x: 0, y: 380, w: 600, h: 70 }, { x: 680, y: 380, w: 800, h: 70 }, { x: 180, y: 300, w: 120, h: 20 }, { x: 360, y: 240, w: 100, h: 20 });
                spikes.push({ x: 600, y: 430, w: 80, h: 20 });
                fishes.push({ x: 200, y: 260, collected: false }, { x: 240, y: 260, collected: false });
                enemies.push({ x: 300, y: 350, w: 24, h: 24, vx: -1, minX: 100, maxX: 500 });
                flag = { x: 1350, y: 220, w: 20, h: 160 };
            }
        }

        function showMainMenu() { document.getElementById("mainMenu").classList.remove("hidden"); document.getElementById("newGameScreen").classList.add("hidden"); document.getElementById("loadGameScreen").classList.add("hidden"); }
        function showNewGameScreen() { document.getElementById("mainMenu").classList.add("hidden"); document.getElementById("newGameScreen").classList.remove("hidden"); }
        function showLoadGameScreen() { document.getElementById("mainMenu").classList.add("hidden"); document.getElementById("loadGameScreen").classList.remove("hidden"); renderSaveSlots(); }

        function startNewGame() {
            initAudio();
            const nameInput = document.getElementById("playerNameInput").value.trim();
            currentPlayer = nameInput || "Bagol"; score = 400; fishCount = 0; bankScore = 4; lives = 10; timeLeft = 600;
            document.getElementById("newGameScreen").classList.add("hidden");
            triggerLevelStart(1);
        }

        function triggerLevelStart(lvlNum) {
            gameState = "LEVEL_TRANSITION"; loadLevel(lvlNum);
            const transScreen = document.getElementById("levelTransitionScreen");
            document.getElementById("transLevelTitle").textContent = `LEVEL ${lvlNum}`;
            document.getElementById("transLivesText").textContent = `NYAWA x ${lives}`;
            transScreen.classList.remove("hidden");
            setTimeout(() => { transScreen.classList.add("hidden"); gameState = "PLAYING"; }, 1800);
        }

        function renderSaveSlots() {
            const saveListElem = document.getElementById("saveList");
            saveListElem.innerHTML = `
                <div class="save-item"><div class="save-info"><strong>Bagol</strong><br><small>Level 1 | Ikan: 4</small></div><button class="btn-play" onclick="loadSaveGame(0)">Lanjut</button></div>
                <div class="save-item"><div class="save-info"><strong>Ejot</strong><br><small>Level 3 | Ikan: 3</small></div><button class="btn-play" onclick="loadSaveGame(1)">Lanjut</button></div>
            `;
        }

        function loadSaveGame(idx) { initAudio(); document.getElementById("loadGameScreen").classList.add("hidden"); triggerLevelStart(1); }

        function update() {
            if (gameState !== "PLAYING") return;
            if (keys.right) player.vx = player.speed;
            else if (keys.left) player.vx = -player.speed;
            else player.vx = 0;

            player.vy += player.gravity; player.x += player.vx; player.y += player.vy;
            player.grounded = false;

            platforms.forEach(p => {
                if (player.x < p.x + p.w && player.x + player.width > p.x && player.y + player.height >= p.y && player.y + player.height <= p.y + p.h && player.vy >= 0) {
                    player.grounded = true; player.vy = 0; player.y = p.y - player.height;
                }
            });

            cameraX = player.x - 200; if (cameraX < 0) cameraX = 0;
            fishes.forEach(f => {
                if (!f.collected && Math.hypot(player.x - f.x, player.y - f.y) < 25) { f.collected = true; fishCount++; score += 100; playSound('coin'); }
            });

            if (player.y > 480) { lives--; triggerLevelStart(currentLevelNum); }
        }

        function drawUI() {
            ctx.fillStyle = "rgba(7, 14, 38, 0.85)"; ctx.fillRect(0, 0, canvas.width, 40);
            ctx.fillStyle = "#38bdf8"; ctx.font = "bold 11px 'Courier New'";
            ctx.fillText(`SKOR ${String(score).padStart(6, '0')}`, 20, 25);
            ctx.fillText(`IKAN ${fishCount}`, 160, 25);
            ctx.fillText(`NYAWA ${lives}`, 280, 25);
        }

        function render() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(-cameraX, 0);
            platforms.forEach(p => { ctx.fillStyle = "#0284c7"; ctx.fillRect(p.x, p.y, p.w, p.h); });
            fishes.forEach(f => { if (!f.collected) { ctx.fillStyle = "#38bdf8"; ctx.beginPath(); ctx.arc(f.x, f.y, 7, 0, Math.PI * 2); ctx.fill(); } });
            ctx.fillStyle = "#ffffff"; ctx.fillRect(player.x, player.y, player.width, player.height);
            ctx.restore();
            drawUI();
        }

        function gameLoop() { update(); render(); requestAnimationFrame(gameLoop); }
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
